<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amsterdam News (1922-1929) · Dangerous Press Archive</title>
    <meta name="description" content="Browse digitized issues of the Amsterdam News from 1922-1929.">
    <meta name="keywords" content="Amsterdam News, African American newspapers, Black press, historic newspapers, 1922-1929, digitized newspapers, New York">
    <link rel="canonical" href="https://dangerouspress.org/newspapers/amsterdam-news.html">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://dangerouspress.org/newspapers/amsterdam-news.html">
    <meta property="og:title" content="Amsterdam News (1922-1929) · Dangerous Press Archive">
    <meta property="og:description" content="Browse digitized issues of the Amsterdam News from 1922-1929.">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary">
    <meta property="twitter:url" content="https://dangerouspress.org/newspapers/amsterdam-news.html">
    <meta property="twitter:title" content="Amsterdam News (1922-1929) · Dangerous Press Archive">
    <meta property="twitter:description" content="Browse digitized issues of the Amsterdam News from 1922-1929.">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <!-- Main Container -->
    <div id="app" class="relative min-h-screen">

        <!-- Header -->
        <header id="main-header" class="glass py-6 px-4 md:px-6 transition-all duration-300">
            <div class="max-w-7xl mx-auto">
                <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                    <!-- Logo & Title -->
                    <div class="flex flex-col sm:flex-row items-center gap-4 md:gap-6 text-center md:text-left branding-lockup">
                        <a href="../index.html" class="brand-emblem" aria-label="Return to archive home">
                            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <rect x="6" y="12" width="52" height="40" rx="4" fill="#F5F1E8" stroke="#8B7355" stroke-width="2"/>
                                <path d="M12 20H52" stroke="#8B7355" stroke-width="3" stroke-linecap="round"/>
                                <path d="M12 28H44" stroke="#8B7355" stroke-width="3" stroke-linecap="round"/>
                                <path d="M12 36H40" stroke="#8B7355" stroke-width="3" stroke-linecap="round"/>
                                <path d="M12 44H36" stroke="#8B7355" stroke-width="3" stroke-linecap="round"/>
                                <path d="M50 24V48" stroke="#8B7355" stroke-width="3" stroke-linecap="round"/>
                                <path d="M45 24V48" stroke="#8B7355" stroke-width="3" stroke-linecap="round"/>
                                <path d="M16 48H32" stroke="#8B7355" stroke-width="3" stroke-linecap="round"/>
                            </svg>
                        </a>
                        <div>
                            <h1 class="hero-title editorial-title transition-all duration-300">
                                <a href="../index.html" class="hover:opacity-80 transition-opacity" style="color: inherit; text-decoration: none;">Dangerous Press</a>
                            </h1>
                            <p class="text-sm mt-1 font-medium subtitle-text" style="color: var(--text-secondary);">An Archive of African American Newspapers, 1905–1929</p>
                        </div>
                    </div>

                    <!-- Navigation -->
                    <div class="flex gap-4 text-sm">
                        <a href="../index.html" class="font-medium transition-colors deco-link" style="color: var(--text-muted);">Browse Archive</a>
                        <a href="../about.html" class="font-medium transition-colors deco-link" style="color: var(--text-muted);">About</a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <div class="max-w-7xl mx-auto px-4 md:px-6 py-8">
            <main>
                <!-- Newspaper Header -->
                <div class="glass-card rounded-2xl p-8 mb-8">
                    <h2 class="text-4xl md:text-5xl font-black mb-4" style="font-family: 'Playfair Display', serif; color: var(--unc-longleaf-pine);">
                        Amsterdam News
                    </h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-6">
                        <div class="stat-card p-4 rounded-lg" style="background: var(--bg-hover); border: 1px solid var(--border-color);">
                            <div class="text-sm font-semibold uppercase tracking-wider mb-1" style="color: var(--text-muted);">Years Covered</div>
                            <div class="text-3xl font-bold" style="color: var(--unc-tile-teal);">1922–1929</div>
                        </div>
                        <div class="stat-card p-4 rounded-lg" style="background: var(--bg-hover); border: 1px solid var(--border-color);">
                            <div class="text-sm font-semibold uppercase tracking-wider mb-1" style="color: var(--text-muted);">Total Issues</div>
                            <div class="text-3xl font-bold" style="color: var(--unc-tile-teal);" id="issue-count">0</div>
                        </div>
                        <div class="stat-card p-4 rounded-lg" style="background: var(--bg-hover); border: 1px solid var(--border-color);">
                            <div class="text-sm font-semibold uppercase tracking-wider mb-1" style="color: var(--text-muted);">Total Pages</div>
                            <div class="text-3xl font-bold" style="color: var(--unc-tile-teal);" id="page-count">0</div>
                        </div>
                    </div>
                </div>

                <!-- Filters -->
                <section class="glass-card rounded-2xl p-6 mb-8">
                    <div class="flex flex-wrap gap-4">
                        <!-- Year Filter -->
                        <div class="filter-group flex-1 min-w-[200px]">
                            <label class="block text-sm font-semibold uppercase tracking-wider mb-3" style="color: var(--text-muted);">Year</label>
                            <div id="year-selector" class="flex flex-wrap gap-2">
                                <button class="filter-btn active" data-year="all">All Years</button>
                                <!-- Year buttons will be added by JS -->
                            </div>
                        </div>

                        <!-- Month Filter -->
                        <div class="filter-group flex-1 min-w-[200px]" id="month-filter-group">
                            <label class="block text-sm font-semibold uppercase tracking-wider mb-3" style="color: var(--text-muted);">Month</label>
                            <div id="month-selector" class="flex flex-wrap gap-2">
                                <button class="filter-btn active" data-month="all">All Months</button>
                                <!-- Month buttons will be added by JS -->
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Issue Grid -->
                <div id="issue-grid-wrapper">
                    <div class="mb-4 flex items-center justify-between">
                        <h3 id="grid-title" class="text-2xl font-bold" style="color: var(--unc-longleaf-pine);">All Issues</h3>
                        <div class="text-sm" style="color: var(--text-muted);">
                            Showing <span id="showing-count">0</span> of <span id="total-count">0</span> issues
                        </div>
                    </div>
                    <div id="issue-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                        <!-- Issue cards will be populated by JavaScript -->
                    </div>
                </div>

                <!-- Loading State -->
                <div id="loading-state" class="text-center py-20">
                    <div class="inline-block">
                        <div class="w-16 h-16 border-4 rounded-full animate-spin" style="border-color: var(--border-color); border-top-color: var(--unc-tile-teal);"></div>
                        <p class="mt-4" style="color: var(--text-muted);">Loading issues...</p>
                    </div>
                </div>

                <!-- Empty State -->
                <div id="empty-state" class="hidden text-center py-20">
                    <div class="glass-card rounded-xl p-12">
                        <p class="text-xl" style="color: var(--text-muted);">No issues found for the selected filters</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        let allIssues = [];
        let filteredIssues = [];
        let selectedYear = 'all';
        let selectedMonth = 'all';

        const MONTHS = [
            'January', 'February', 'March', 'April', 'May', 'June',
            'July', 'August', 'September', 'October', 'November', 'December'
        ];

        async function loadData() {
            try {
                const response = await fetch('../web_content/manifest.json');
                const manifest = await response.json();

                // Filter to Amsterdam News only
                allIssues = manifest.filter(issue => issue.title === 'Amsterdam News');

                // Sort by date (oldest first)
                allIssues.sort((a, b) => a.date.localeCompare(b.date));

                // Update stats
                const totalPages = allIssues.reduce((sum, issue) => sum + issue.pages, 0);
                document.getElementById('issue-count').textContent = allIssues.length;
                document.getElementById('page-count').textContent = totalPages.toLocaleString();
                document.getElementById('total-count').textContent = allIssues.length;

                // Build year filter
                buildYearFilter();

                // Show all issues initially
                filteredIssues = allIssues;
                renderIssues();

                // Hide loading
                document.getElementById('loading-state').style.display = 'none';
                document.getElementById('issue-grid-wrapper').style.display = 'block';

            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('loading-state').innerHTML = '<p style="color: var(--text-muted);">Error loading issues</p>';
            }
        }

        function buildYearFilter() {
            const years = [...new Set(allIssues.map(i => i.date.substring(0, 4)))].sort();
            const yearSelector = document.getElementById('year-selector');

            years.forEach(year => {
                const count = allIssues.filter(i => i.date.startsWith(year)).length;
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.dataset.year = year;
                btn.innerHTML = `${year} <span class="count">(${count})</span>`;
                btn.onclick = () => selectYear(year);
                yearSelector.appendChild(btn);
            });
        }

        function buildMonthFilter(year) {
            const monthSelector = document.getElementById('month-selector');

            // Clear existing months (except "All Months")
            while (monthSelector.children.length > 1) {
                monthSelector.removeChild(monthSelector.lastChild);
            }

            if (year === 'all') return;

            // Get issues for this year
            const yearIssues = allIssues.filter(i => i.date.startsWith(year));

            // Find which months have issues
            const monthsWithIssues = new Map();
            yearIssues.forEach(issue => {
                const monthNum = parseInt(issue.date.substring(5, 7)) - 1;
                monthsWithIssues.set(monthNum, (monthsWithIssues.get(monthNum) || 0) + 1);
            });

            // Add month buttons
            monthsWithIssues.forEach((count, monthIndex) => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.dataset.month = monthIndex;
                btn.innerHTML = `${MONTHS[monthIndex]} <span class="count">(${count})</span>`;
                btn.onclick = () => selectMonth(monthIndex);
                monthSelector.appendChild(btn);
            });
        }

        function selectYear(year) {
            selectedYear = year;
            selectedMonth = 'all';

            // Update button states
            document.querySelectorAll('[data-year]').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.year === year);
            });

            // Reset month filter
            document.querySelectorAll('[data-month]').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.month === 'all');
            });

            // Rebuild month filter for this year
            buildMonthFilter(year);

            // Filter and render
            applyFilters();
        }

        function selectMonth(month) {
            selectedMonth = month;

            // Update button states
            document.querySelectorAll('[data-month]').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.month == month);
            });

            // Filter and render
            applyFilters();
        }

        function applyFilters() {
            filteredIssues = allIssues.filter(issue => {
                const issueYear = issue.date.substring(0, 4);
                const issueMonth = parseInt(issue.date.substring(5, 7)) - 1;

                const yearMatch = selectedYear === 'all' || issueYear === selectedYear;
                const monthMatch = selectedMonth === 'all' || issueMonth == selectedMonth;

                return yearMatch && monthMatch;
            });

            renderIssues();
        }

        function renderIssues() {
            const grid = document.getElementById('issue-grid');
            const emptyState = document.getElementById('empty-state');
            const gridWrapper = document.getElementById('issue-grid-wrapper');

            document.getElementById('showing-count').textContent = filteredIssues.length;

            // Update title
            let title = 'All Issues';
            if (selectedYear !== 'all') {
                title = selectedYear;
                if (selectedMonth !== 'all') {
                    title = `${MONTHS[selectedMonth]} ${selectedYear}`;
                }
            }
            document.getElementById('grid-title').textContent = title;

            if (filteredIssues.length === 0) {
                gridWrapper.style.display = 'none';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            gridWrapper.style.display = 'block';

            // Clear grid
            grid.innerHTML = '';

            // Render issue cards
            filteredIssues.forEach(issue => {
                const card = document.createElement('a');
                card.href = `../?paper=amsterdam-news&date=${issue.date}`;
                card.className = 'issue-card glass-card rounded-xl overflow-hidden transition-all hover:scale-105 hover:shadow-lg';
                card.style.textDecoration = 'none';
                card.style.display = 'block';

                const thumbUrl = issue.base_url
                    ? `${issue.base_url}/thumb.jpg`
                    : `../web_content/amsterdam-news/${issue.date.substring(0, 4)}/${issue.date}/thumb.jpg`;

                const dateObj = new Date(issue.date + 'T00:00:00');
                const formattedDate = dateObj.toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });

                card.innerHTML = `
                    <div class="aspect-[3/4] bg-gray-100 overflow-hidden">
                        <img
                            src="${thumbUrl}"
                            alt="${issue.title} - ${formattedDate}"
                            class="w-full h-full object-cover"
                            loading="lazy"
                            onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 300 400%22%3E%3Crect fill=%22%23e5e7eb%22 width=%22300%22 height=%22400%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-family=%22sans-serif%22 font-size=%2218%22 fill=%22%236b7280%22%3EImage Not Available%3C/text%3E%3C/svg%3E'"
                        />
                    </div>
                    <div class="p-4">
                        <div class="text-sm font-semibold mb-1" style="color: var(--unc-tile-teal);">
                            ${formattedDate}
                        </div>
                        <div class="text-xs" style="color: var(--text-muted);">
                            ${issue.pages} page${issue.pages !== 1 ? 's' : ''}
                        </div>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        // Load data on page load
        loadData();
    </script>

    <style>
        .filter-btn {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            background: var(--bg-hover);
            border: 2px solid var(--border-color);
            color: var(--text-primary);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            background: var(--bg-secondary);
        }

        .filter-btn.active {
            background: var(--unc-tile-teal);
            border-color: var(--unc-tile-teal);
            color: white;
        }

        .filter-btn .count {
            opacity: 0.7;
            font-size: 0.75rem;
        }

        .issue-card {
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .issue-card:hover {
            transform: translateY(-4px);
        }
    </style>
</body>
</html>
