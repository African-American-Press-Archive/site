name = "dangerouspress"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[assets]
directory = "./src/public/"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "dangerouspress-db"
database_id = "<to-be-created>"

[[r2_buckets]]
binding = "R2"
bucket_name = "dangerouspress-pages"
